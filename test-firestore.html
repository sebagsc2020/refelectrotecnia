<!DOCTYPE html>
<html>
<head>
  <title>Test Firestore</title>
</head>
<body>
  <button id="btn">Guardar</button>
  <pre id="log">Esperando...</pre>

  <script type="importmap">
  {
    "imports": {
      "firebase/app": "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js",
      "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"
    }
  }
  </script>

  <script type="module">
    import { initializeApp } from 'firebase/app';
    import { getFirestore, collection, addDoc } from 'firebase/firestore';

    const firebaseConfig = {
      apiKey: "AIzaSyA5TiqIPtlIE-PFAFyGMH1qqSlGPbXbINw",
      authDomain: "refelectrotecnia.firebaseapp.com",
      projectId: "refelectrotecnia",
      storageBucket: "refelectrotecnia.firebasestorage.app",
      messagingSenderId: "204883844019",
      appId: "1:204883844019:web:176d2973209b0cc98fc9c6",
      measurementId: "G-8FDNZ6GJZD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    document.getElementById('btn').onclick = async () => {
      const log = document.getElementById('log');
      log.textContent = 'Guardando...';
      try {
        const docRef = await addDoc(collection(db, 'test_contactos'), {
          nombre: 'Test ' + Date.now(),
          telefono: '123456789'
        });
        log.textContent = '✅ Guardado con ID: ' + docRef.id;
      } catch (error) {
        log.textContent = '❌ Error: ' + error.message;
        console.error(error);
      }
    };
  </script>
</body>
</html>
