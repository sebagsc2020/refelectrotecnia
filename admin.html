    <style>
        /* ===== ESTILOS GENERALES ===== */
        * { margin:0; padding:0; box-sizing:border-box; }
        :root {
            --primary-dark: #0A2E5C;
            --primary-cyan: #00A8FF;
            --light-bg: #F4F6F9;
            --gray-text: #4A4A4A;
            --shadow: 0 4px 15px rgba(0,0,0,0.08);
            --radius: 12px;
            --font: 'Inter', sans-serif;
        }
        body { font-family: var(--font); background: var(--light-bg); color: #1E1E1E; min-height: 100vh; }
        .login-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #0A2E5C 0%, #00A8FF 100%); display: flex; justify-content: center; align-items: center; z-index: 99999; padding: 20px; }
        .login-box { background: white; padding: 40px 35px; border-radius: 16px; box-shadow: 0 30px 60px rgba(0,0,0,0.3); max-width: 420px; width: 100%; text-align: center; }
        .login-box .logo { height: 60px; margin-bottom: 20px; }
        .login-box h2 { color: var(--primary-dark); font-size: 1.6rem; font-weight: 800; margin-bottom: 8px; }
        .login-box .subtitle { color: var(--gray-text); font-size: 0.9rem; margin-bottom: 25px; }
        .login-box input { width: 100%; padding: 14px 16px; border: 2px solid #E9ECEF; border-radius: 10px; font-size: 1rem; font-family: var(--font); margin-bottom: 15px; background: var(--light-bg); }
        .login-box input:focus { outline: none; border-color: var(--primary-cyan); background: white; box-shadow: 0 0 0 4px rgba(0,168,255,0.1); }
        .login-box .btn-login { width: 100%; background: var(--primary-cyan); color: white; border: none; padding: 14px; border-radius: 10px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: 0.3s; }
        .login-box .btn-login:hover { background: var(--primary-dark); }
        .login-box .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
        .login-box .error-msg { color: #e74c3c; font-size: 0.9rem; margin-top: 10px; display: none; font-weight: 600; }
        .dashboard-locked { display: none !important; }
        .dashboard { padding: 20px; max-width: 1400px; margin: 0 auto; }
        .dashboard-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 16px; background: white; padding: 16px 28px; border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 15px; }
        .dashboard-header h2 { font-size: 1.6rem; font-weight: 800; color: var(--primary-dark); }
        .dashboard-header h2 span { color: var(--primary-cyan); }
        .dashboard-header .header-actions { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .dashboard-header .btn-logout { background: transparent; color: var(--gray-text); border: 2px solid #E9ECEF; padding: 10px 20px; border-radius: 50px; font-weight: 600; font-size: 0.9rem; cursor: pointer; transition: 0.3s; }
        .dashboard-header .btn-logout:hover { background: #f1f1f1; border-color: #ccc; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 15px; }
        .stat-card { background: white; padding: 20px 22px; border-radius: var(--radius); box-shadow: var(--shadow); border-left: 5px solid var(--primary-cyan); }
        .stat-card .stat-number { font-size: 2.2rem; font-weight: 800; color: var(--primary-dark); }
        .stat-card .stat-label { font-size: 0.9rem; color: var(--gray-text); margin-top: 4px; }
        .stat-card .stat-icon { float: right; font-size: 2rem; color: var(--primary-cyan); opacity: 0.4; }
        .stat-card.emergencia { border-left-color: #e74c3c; }
        .stat-card.emergencia .stat-icon { color: #e74c3c; }
        /* ===== TARJETA PENDIENTE (ROJA) ===== */
        .stat-card.pendiente { 
            border-left-color: #e74c3c; 
            background-color: #e74c3c; 
            color: #ffffff;
        }
        .stat-card.pendiente .stat-number,
        .stat-card.pendiente .stat-label,
        .stat-card.pendiente .stat-icon {
            color: #ffffff;
        }
        .stat-card.pendiente .stat-icon {
            opacity: 0.7;
        }
        .chart-section { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; margin-bottom: 15px; }
        .chart-box { background: white; padding: 20px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .chart-box h4 { font-size: 1rem; font-weight: 700; color: var(--primary-dark); margin-bottom: 16px; }
        .chart-box canvas { max-height: 220px; max-width: 100%; }
        .table-container { background: white; border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; padding: 0 0 12px 0; margin-bottom: 15px; }
        .table-container h4 { padding: 18px 24px 10px 24px; font-size: 1rem; font-weight: 700; color: var(--primary-dark); }
        .table-scroll { overflow-x: auto; padding: 0 16px 16px 16px; }
        .filtro-container { display: flex; gap: 10px; padding: 10px 24px; align-items: center; flex-wrap: wrap; }
        .filtro-container label { font-weight: 600; font-size: 0.85rem; color: var(--primary-dark); }
        .filtro-container select { padding: 8px 12px; border: 2px solid #E9ECEF; border-radius: 8px; font-family: var(--font); font-size: 0.85rem; background: white; cursor: pointer; }
        .filtro-container select:focus { outline: none; border-color: var(--primary-cyan); }
        .filtro-container input[type="text"] {
            padding: 8px 12px;
            border: 2px solid #E9ECEF;
            border-radius: 8px;
            font-family: var(--font);
            font-size: 0.85rem;
            background: white;
            flex: 1;
            min-width: 160px;
        }
        .filtro-container input[type="text"]:focus {
            outline: none;
            border-color: var(--primary-cyan);
        }
        table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
        table thead { background: var(--light-bg); }
        table th { text-align: left; padding: 12px 14px; font-weight: 600; color: var(--primary-dark); border-bottom: 2px solid #E9ECEF; white-space: nowrap; }
        table td { padding: 12px 14px; border-bottom: 1px solid #E9ECEF; color: var(--gray-text); vertical-align: middle; }
        table tbody tr:hover { background: #F8FAFC; }
        table tfoot td { font-weight: 700; color: var(--primary-dark); background: var(--light-bg); border-top: 2px solid #E9ECEF; padding: 12px 14px; white-space: nowrap; }
        .badge-emergencia { background: #fee2e2; color: #b91c1c; padding: 2px 12px; border-radius: 50px; font-size: 0.75rem; font-weight: 600; display: inline-block; }
        .btn-edit { background: var(--primary-cyan); color: white; border: none; padding: 5px 14px; border-radius: 50px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 5px; margin-right: 6px; }
        .btn-edit:hover { background: var(--primary-dark); transform: scale(1.05); }
        .btn-delete { background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 50px; font-size: 0.8rem; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; margin-right: 6px; }
        .btn-delete:hover { background: #c0392b; transform: scale(1.05); }
        .btn-presupuesto { background: #2ecc71; color: white; border: none; padding: 5px 10px; border-radius: 50px; font-size: 0.8rem; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; justify-content: center; margin-right: 6px; }
        .btn-presupuesto:hover { background: #27ae60; transform: scale(1.05); }
        .btn-whatsapp { background: #25D366; color: white; padding: 6px 14px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: 0.3s; border: none; cursor: pointer; }
        .btn-whatsapp:hover { background: #1DA851; transform: scale(1.05); }
        .btn-whatsapp-alerta { background: #e74c3c; color: white; padding: 6px 14px; border-radius: 50px; font-size: 0.85rem; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: 0.3s; border: none; cursor: pointer; }
        .btn-whatsapp-alerta:hover { background: #c0392b; transform: scale(1.05); }
        .alerta-vencido { color: #e74c3c; font-size: 1rem; margin-left: 6px; animation: pulso 1.5s infinite; }
        @keyframes pulso { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        .badge { display: inline-block; padding: 2px 12px; border-radius: 50px; font-weight: 600; }
        .maps-link { color: var(--primary-cyan); font-size: 1.1rem; text-decoration: none; transition: 0.2s; }
        .maps-link:hover { color: var(--primary-dark); transform: scale(1.1); }
        .loading { text-align: center; padding: 40px; color: var(--gray-text); }
        .loading i { font-size: 2rem; color: var(--primary-cyan); animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .no-data { text-align: center; padding: 40px; color: var(--gray-text); }
        /* ===== MODALES EXISTENTES (edit y presupuesto) ===== */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 9999; justify-content: center; align-items: center; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: white; border-radius: var(--radius); max-width: 600px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 35px 30px; box-shadow: 0 30px 60px rgba(0,0,0,0.3); animation: modalFade 0.3s ease; }
        @keyframes modalFade { from { opacity:0; transform:scale(0.95) translateY(20px); } to { opacity:1; transform:scale(1) translateY(0); } }
        .modal-box h3 { font-size: 1.4rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 20px; padding-right: 30px; }
        .modal-box h3 span { color: var(--primary-cyan); }
        .modal-box .close-modal { float: right; background: none; border: none; font-size: 2rem; color: var(--gray-text); cursor: pointer; transition: 0.3s; line-height: 1; }
        .modal-box .close-modal:hover { color: var(--primary-dark); transform: rotate(90deg); }
        .modal-box .form-group { margin-bottom: 16px; }
        .modal-box label { display: block; font-weight: 600; font-size: 0.9rem; color: var(--primary-dark); margin-bottom: 4px; }
        .modal-box input, .modal-box select, .modal-box textarea { width: 100%; padding: 12px 14px; border: 2px solid #E9ECEF; border-radius: 8px; font-size: 1rem; font-family: var(--font); transition: 0.2s; background: var(--light-bg); }
        .modal-box input:focus, .modal-box select:focus, .modal-box textarea:focus { outline: none; border-color: var(--primary-cyan); background: white; box-shadow: 0 0 0 4px rgba(0,168,255,0.1); }
        .modal-box textarea { resize: vertical; min-height: 80px; }
        .modal-box .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 20px; }
        .modal-box .btn-save { background: var(--primary-cyan); color: white; border: none; padding: 12px 30px; border-radius: 50px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .modal-box .btn-save:hover { background: var(--primary-dark); transform: translateY(-2px); }
        .modal-box .btn-cancel { background: transparent; color: var(--gray-text); border: 2px solid #E9ECEF; padding: 12px 30px; border-radius: 50px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .modal-box .btn-cancel:hover { background: #f1f1f1; border-color: #ccc; }
        .estado-select { padding: 5px 10px; border: 2px solid #E9ECEF; border-radius: 6px; font-size: 0.8rem; font-family: var(--font); font-weight: 600; cursor: pointer; min-width: 110px; }
        .estado-select.estado-aprobado { border-color: #2ecc71; color: #27ae60; background: #f0fff4; }
        .estado-select.estado-encurso { border-color: #f39c12; color: #e67e22; background: #fff8f0; }
        .estado-select.estado-vencido { border-color: #e74c3c; color: #c0392b; background: #fff5f5; }
        .estado-select.estado-cancelado { border-color: #7f8c8d; color: #555; background: #f5f5f5; }
        .estado-select.estado-realizado { border-color: #2ecc71; color: #27ae60; background: #f0fff4; }
        .presupuesto-box { max-width: 900px; }
        .presupuesto-box .presupuesto-datos { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .presupuesto-box .presupuesto-datos .full-width { grid-column: 1 / -1; }
        .presupuesto-box .presupuesto-actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: flex-end; margin-top: 10px; }
        .presupuesto-box .presupuesto-actions .btn-guardar { background: var(--primary-dark); color: white; border: none; padding: 10px 20px; border-radius: 50px; font-weight: 600; font-size: 0.95rem; cursor: pointer; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px; }
        .presupuesto-box .presupuesto-actions .btn-guardar:hover { background: var(--primary-cyan); transform: translateY(-2px); }
        .presupuesto-box .presupuesto-actions .btn-guardar:disabled { opacity: 0.7; cursor: not-allowed; transform: none; }
        .check-presupuesto { color: #27ae60; font-size: 1.2rem; font-weight: bold; }
        .no-presupuesto { color: #ccc; font-size: 1.2rem; }

        /* ===== MODAL PERSONALIZADO ===== */
        .custom-modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(6px);
            z-index: 99999;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .custom-modal-overlay.active {
            display: flex;
        }
        .custom-modal-box {
            background: white;
            border-radius: 16px;
            max-width: 480px;
            width: 100%;
            padding: 30px 28px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.4);
            animation: modalFade 0.25s ease;
            text-align: center;
        }
        .custom-modal-box .icon {
            font-size: 3.2rem;
            margin-bottom: 12px;
        }
        .custom-modal-box .icon.success { color: #27ae60; }
        .custom-modal-box .icon.error { color: #e74c3c; }
        .custom-modal-box .icon.warning { color: #f39c12; }
        .custom-modal-box .icon.info { color: var(--primary-cyan); }
        .custom-modal-box h3 {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--primary-dark);
            margin-bottom: 8px;
        }
        .custom-modal-box p {
            color: var(--gray-text);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 20px;
        }
        .custom-modal-box .buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .custom-modal-box .buttons .btn-custom {
            padding: 10px 28px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.95rem;
            border: none;
            cursor: pointer;
            transition: 0.3s;
            min-width: 100px;
            font-family: var(--font);
        }
        .custom-modal-box .buttons .btn-custom.primary {
            background: var(--primary-cyan);
            color: white;
        }
        .custom-modal-box .buttons .btn-custom.primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }
        .custom-modal-box .buttons .btn-custom.danger {
            background: #e74c3c;
            color: white;
        }
        .custom-modal-box .buttons .btn-custom.danger:hover {
            background: #c0392b;
            transform: translateY(-2px);
        }
        .custom-modal-box .buttons .btn-custom.secondary {
            background: transparent;
            color: var(--gray-text);
            border: 2px solid #E9ECEF;
        }
        .custom-modal-box .buttons .btn-custom.secondary:hover {
            background: #f1f1f1;
            border-color: #ccc;
        }

        /* ===== EXPANDIR FILAS ===== */
        .mensaje-cell,
        .descripcion-cell {
            position: relative;
            overflow: hidden;
            white-space: pre-wrap;
            word-wrap: break-word;
            cursor: pointer;
            transition: max-height 0.3s ease;
        }
        .mensaje-cell { max-height: 3em; }
        .descripcion-cell { max-height: 1.5em; }
        .mensaje-cell.expandido,
        .descripcion-cell.expandido { max-height: none; }
        .mensaje-cell:not(.expandido).has-more::after,
        .descripcion-cell:not(.expandido).has-more::after {
            content: "\f078";
            font-family: "Font Awesome 6 Free";
            font-weight: 900;
            position: absolute;
            bottom: 0;
            right: 0;
            background: white;
            padding: 0 4px 0 8px;
            box-shadow: -10px 0 10px -5px white;
            pointer-events: none;
            color: var(--primary-cyan);
            font-size: 0.9rem;
        }
        table tbody tr:hover .mensaje-cell:not(.expandido).has-more::after,
        table tbody tr:hover .descripcion-cell:not(.expandido).has-more::after {
            background: #F8FAFC;
            box-shadow: -10px 0 10px -5px #F8FAFC;
        }
        .table-scroll tbody tr td:last-child { cursor: default; }

        /* ===== FIJAR ANCHO DE COLUMNAS EN "TODOS LOS REGISTROS" ===== */
        #tablaContainer table {
            table-layout: fixed;
            width: 100%;
        }
        #tablaContainer table td:nth-child(6) { /* Mensaje */
            max-width: 200px;
            word-break: break-word;
            white-space: normal;
        }
        #tablaContainer table td:nth-child(5) { /* Ubicación */
            width: 40px;
            max-width: 40px;
            min-width: 35px;
            white-space: nowrap;
            text-align: center;
        }
        #tablaContainer table td:nth-child(7) { /* Presupuesto */
            width: 45px;
            max-width: 45px;
            min-width: 40px;
            white-space: nowrap;
            text-align: center;
        }
        #tablaContainer table td:nth-child(8) { /* Acciones */
            width: auto;
            white-space: nowrap;
        }

        /* ===== TABLA PRESUPUESTOS ===== */
        #presupuestosContainer table {
            table-layout: fixed;
            width: 100%;
            font-size: 0.85rem;
        }
        #presupuestosContainer table th,
        #presupuestosContainer table td { padding: 8px 10px; }
        #presupuestosContainer table th:nth-child(1),
        #presupuestosContainer table td:nth-child(1) { width: 11%; }
        #presupuestosContainer table th:nth-child(2),
        #presupuestosContainer table td:nth-child(2) { width: 12%; }
        #presupuestosContainer table th:nth-child(3),
        #presupuestosContainer table td:nth-child(3) { width: 22%; max-width: 150px; word-wrap: break-word; white-space: pre-wrap; }
        #presupuestosContainer table th:nth-child(4),
        #presupuestosContainer table td:nth-child(4) { width: 12%; }
        #presupuestosContainer table th:nth-child(5),
        #presupuestosContainer table td:nth-child(5) { width: 14%; }
        #presupuestosContainer table th:nth-child(6),
        #presupuestosContainer table td:nth-child(6) { width: 10%; }
        #presupuestosContainer table th:nth-child(7),
        #presupuestosContainer table td:nth-child(7) { width: 10%; }
        #presupuestosContainer table th:nth-child(8),
        #presupuestosContainer table td:nth-child(8) { width: 8%; min-width: 65px; text-align: center; white-space: normal; word-break: keep-all; }
        .estado-select { max-width: 100%; min-width: 80px; font-size: 0.75rem; padding: 3px 6px; }

        @media (max-width: 600px) {
            #presupuestosContainer table { display: table; table-layout: auto; font-size: 0.8rem; min-width: 700px; width: auto; }
            #presupuestosContainer table thead { display: table-header-group; }
            #presupuestosContainer table tbody { display: table-row-group; }
            #presupuestosContainer table tbody tr { display: table-row; box-shadow: none; border: none; margin: 0; padding: 0; background: transparent; }
            #presupuestosContainer table tbody tr:hover { background: #F8FAFC; }
            #presupuestosContainer table tbody tr td { display: table-cell; padding: 6px 8px; border-bottom: 1px solid #E9ECEF; white-space: normal; word-break: break-word; }
            #presupuestosContainer table tbody tr td::before { content: none; }
            #presupuestosContainer table tfoot { display: table-footer-group; }
            #presupuestosContainer table tfoot tr { display: table-row; background: var(--light-bg); }
            #presupuestosContainer table tfoot td { display: table-cell; padding: 8px 10px; border-top: 2px solid #E9ECEF; white-space: nowrap; }
            .estado-select { min-width: 70px; font-size: 0.7rem; padding: 2px 4px; }
            .btn-delete { padding: 4px 8px; font-size: 0.75rem; }
            .descripcion-cell { max-height: 2.5em; }
            .filtro-container { flex-direction: column; align-items: stretch; }
            .filtro-container select,
            .filtro-container input[type="text"] { width: 100%; min-width: unset; }
        }

        /* ===== DISEÑO DEL PRESUPUESTO (PDF) ===== */
        .presupuesto-preview {
            --primary-dark: #0a1a2f;
            --primary-mid: #1a365d;
            --primary-blue: #2563eb;
            --accent-gold: #d4af37;
            --accent-gold-light: #fef3c7;
            --gray-50: #f8fafc;
            --gray-100: #f1f5f9;
